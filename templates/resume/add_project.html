{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Project</title>
    <link rel="stylesheet" href="{% static 'resume/css/form.css' %}">
</head>

<body>

<div class="form-container">

    <h2>Add Project</h2>

    <form method="post">
        {% csrf_token %}

        <label>Project Name</label>
        <input type="text" name="name" placeholder="Enter project name">

        <label>Description</label>
        <textarea name="description" placeholder="Project details"></textarea>

        <label>Tools</label>
        <input type="text" name="tools" placeholder="Tools used">

        <div class="button-group">
            <button type="submit">Submit</button>
            <a href="{% url 'resume_detail' resume.id %}" class="back-button">Back</a>
        </div>
    </form>

</div>

</body>
</html>
