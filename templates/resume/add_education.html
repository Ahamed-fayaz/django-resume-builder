{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Education</title>

    <link rel="stylesheet" href="{% static 'resume/css/form.css' %}">
</head>

<body>

    <div class="form-container">

        <h2>Add Education</h2>

        <form method="post">

            {% csrf_token %}

            <label>Degree</label>
            <input
                type="text"
                name="degree"
                placeholder="Enter Degree"
            >

            <label>Course</label>
            <input
                type="text"
                name="course"
                placeholder="Enter Course"
            >

            <label>College</label>
            <input
                type="text"
                name="college"
                placeholder="Enter College"
            >

            <label>Completed Year</label>
            <input
                type="text"
                name="year"
                placeholder="Enter Completed Year"
            >

            <label>Grade</label>
            <input
                type="text"
                name="grade"
                placeholder="Enter Grade"
            >

            <div class="button-group">

                <button type="submit">
                    Submit
                </button>

                <a
                    href="{% url 'resume_detail' resume.id %}"
                    class="back-button"
                >
                    Back
                </a>

            </div>

        </form>

    </div>

</body>

</html>
