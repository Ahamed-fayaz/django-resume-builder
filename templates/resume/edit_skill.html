{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Skills</title>

    <link rel="stylesheet" href="{% static 'resume/css/form.css' %}">
</head>

<body>

    <div class="form-container">

        <h2>Edit Skills</h2>

        <form method="post">

            {% csrf_token %}

            <label>Languages</label>
            <textarea
                name="languages"
                rows="3"
            >{{ skill.languages }}</textarea>

            <label>Frontend</label>
            <textarea
                name="frontend"
                rows="3"
            >{{ skill.frontend }}</textarea>

            <label>Backend</label>
            <textarea
                name="backend"
                rows="3"
            >{{ skill.backend }}</textarea>

            <label>Database</label>
            <textarea
                name="database"
                rows="3"
            >{{ skill.database }}</textarea>

            <label>Tools</label>
            <textarea
                name="tools"
                rows="3"
            >{{ skill.tools }}</textarea>

            <label>Methodologies</label>
            <textarea
                name="methodologies"
                rows="3"
            >{{ skill.methodologies }}</textarea>

            <div class="button-group">

                <button type="submit">
                    Update
                </button>

                <a href="{% url 'resume_detail' resume.id %}" class="back-button">Back</a>

            </div>

        </form>

    </div>

</body>

</html>
