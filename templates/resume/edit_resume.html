{% extends "base.html" %}

{% block content %}

<div class="container">

    <form method="post">
        {% csrf_token %}
            <div class="row justify-content-center">

                <div class="col-md-8">
                    <div class="card">
                        <h2 class="card-header bg-info text-dark text-center">Resume</h2>

                        <div class="card-body m-2">

                        <label class="mt-2 mb-2 fw-bold">Name</label>
                        <input type="text" class="form-control" name="fullname" placeholder="name"
                            value="{{details.full_name}}">

                        <label class="mt-2 mb-2 fw-bold">Designation</label>
                        <input type="text" class="form-control" name="designation" placeholder="enter designation"
                            value="{{details.designation}}">
                            
                        <label class="mt-2 mb-2 fw-bold">Email</label>
                        <input type="text" class="form-control" name="email" placeholder="email"
                            value="{{details.email}}">

                        <label class="mt-2 mb-2 fw-bold">Phone</label>
                        <input type="text" class="form-control" name="phone" placeholder="name"
                            value="{{details.phone}}">

                        <label class="mt-2 mb-2 fw-bold">LinkedIn</label>
                        <input type="text" class="form-control" name="linkedin" placeholder="name"
                            value="{{details.linkedin}}">

                        <label class="mt-2 mb-2 fw-bold">Github</label>
                        <input type="text" class="form-control" name="github" placeholder="email"
                            value="{{details.github}}">

                        <label class="mt-2 mb-2 fw-bold">Location</label>
                        <input type="text" class="form-control" name="location" placeholder="Enter Location"
                            value="{{details.location}}">

                        <label class="mt-2 mb-2 fw-bold">Summary</label>
                        <textarea cols="40" rows="5" class="form-control" name="summary"
                            placeholder="add your summary">{{details.summary}}</textarea>                    
                    <button type="submit" class="btn btn-primary mt-3 w-100">Submit</button>
                    </div>
                </div>
            </div>
        
    </form>
</div>
{% endblock %}
