{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Certifications</title>

    <link rel="stylesheet" href="{% static 'resume/css/form.css' %}">
</head>

<body>

    <div class="form-container">

        <h2>Edit Certifications</h2>

        <form method="post">

            {% csrf_token %}

            <label>Certifications</label>

            <textarea
                name="certifications"
                rows="5"
                placeholder="Enter certifications separated by commas"
            >{{ certs }}</textarea>

            <div class="button-group">

                <button type="submit">
                    Update
                </button>

                <a
                    href="{% url 'resume_detail' resume.id %}"
                    class="back-button"
                >
                    Back
                </a>

            </div>

        </form>

    </div>

</body>

</html>
