{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Project</title>
    <link rel="stylesheet" href="{% static 'resume/css/form.css' %}">
</head>

<body>

<div class="form-container">

    <h2>Edit Project</h2>

    <form method="post">
        {% csrf_token %}

        <label>Project Name</label>
        <input type="text" name="name" value="{{ project.name }}">

        <label>Description</label>
        <textarea name="description">{{ project.description }}</textarea>

        <label>Tools</label>
        <input type="text" name="tools" value="{{ project.tools }}">

        <div class="button-group">
            <button type="submit">Update</button>
            <a href="{% url 'resume_detail' project.resume.id %}" class="back-button">Back</a>
        </div>
    </form>

</div>

</body>
</html>
