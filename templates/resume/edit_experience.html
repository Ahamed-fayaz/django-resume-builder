{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Experience</title>
    <link rel="stylesheet" href="{% static 'resume/css/form.css' %}">
</head>

<body>

    <div class="form-container">

        <h2>Edit Experience</h2>

        <form method="post">
            {% csrf_token %}

            <label>Company</label>
            <input type="text" name="company" value="{{ experience.company }}">

            <label>Role</label>
            <input type="text" name="role" value="{{ experience.role }}">

            <label>Start Date</label>
            <input type="text" name="start_date" value="{{ experience.start_date }}">

            <label>End Date</label>
            <input type="text" name="end_date" value="{{ experience.end_date }}">

            <label>Role Description</label>
            <textarea name="role_description">{{ experience.role_description }}</textarea>

            <div class="button-group">
                <button type="submit">Update</button>
                <a href="{% url 'resume_detail' experience.resume.id %}" class="back-button">Back</a>
            </div>
        </form>

    </div>

</body>

</html>
